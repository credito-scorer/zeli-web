<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeli — Demo del asistente web</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap');

  :root {
    --blue: #00C2FF;
    --blue-dark: #0066FF;
    --bg: #03060f;
    --surface: #080d1a;
    --border: #0d1829;
    --text: #e8f0ff;
    --muted: rgba(255,255,255,0.45);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .widget {
    width: 100%;
    max-width: 420px;
    height: 640px;
    max-height: 90vh;
    background: var(--surface);
    border: 1px solid rgba(0,194,255,0.15);
    border-radius: 22px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 24px 70px rgba(0,0,0,0.55);
  }

  .wh-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(0,194,255,0.04);
  }
  .wh-icon {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, #00C2FF, #0066FF);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .wh-icon svg { width: 22px; height: 22px; }
  .wh-name { font-weight: 800; font-size: 17px; letter-spacing: -0.3px; }
  .wh-name span { color: var(--blue); }
  .wh-sub {
    font-size: 11px; color: var(--muted); margin-top: 1px;
    display: flex; align-items: center; gap: 6px;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #2ecc71; }
  .wh-tag {
    margin-left: auto; font-size: 9px; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--blue);
    border: 1px solid rgba(0,194,255,0.25); border-radius: 100px;
    padding: 4px 10px;
  }

  .wh-body {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg { max-width: 82%; font-size: 14px; line-height: 1.5; }
  .msg.bot {
    align-self: flex-start;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 11px 15px;
    border-radius: 4px 16px 16px 16px;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, #00C2FF, #0066FF);
    color: #fff; font-weight: 500;
    padding: 11px 15px;
    border-radius: 16px 4px 16px 16px;
  }
  .typing { align-self: flex-start; display: flex; gap: 4px; padding: 12px 16px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--blue);
    opacity: 0.4; animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2){ animation-delay: 0.15s; }
  .typing span:nth-child(3){ animation-delay: 0.3s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:0.4} 30%{transform:translateY(-5px);opacity:1} }

  .wh-foot {
    padding: 14px 16px; border-top: 1px solid var(--border);
    display: flex; gap: 10px; align-items: flex-end;
  }
  .wh-foot textarea {
    flex: 1; resize: none; background: rgba(255,255,255,0.04);
    border: 1px solid var(--border); border-radius: 14px;
    color: var(--text); font-family: 'Outfit', sans-serif; font-size: 14px;
    padding: 11px 14px; max-height: 90px; outline: none;
  }
  .wh-foot textarea:focus { border-color: rgba(0,194,255,0.4); }
  .wh-foot textarea::placeholder { color: rgba(255,255,255,0.3); }
  .send {
    width: 42px; height: 42px; flex-shrink: 0; border: none; cursor: pointer;
    background: linear-gradient(135deg, #00C2FF, #0066FF);
    border-radius: 12px; display: flex; align-items: center; justify-content: center;
    transition: opacity 0.2s;
  }
  .send:disabled { opacity: 0.35; cursor: default; }
  .send svg { width: 20px; height: 20px; }

  .wh-body::-webkit-scrollbar { width: 6px; }
  .wh-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
</style>
</head>
<body>

<div class="widget">
  <div class="wh-head">
    <div class="wh-icon">
      <svg viewBox="0 0 28 28" fill="none">
        <path d="M6 6h16l-12 8h12" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10 14l-4 8h16" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div>
      <div class="wh-name">Zel<span>i</span></div>
      <div class="wh-sub"><span class="dot"></span> En línea · responde al instante</div>
    </div>
    <div class="wh-tag">Demo</div>
  </div>

  <div class="wh-body" id="body"></div>

  <div class="wh-foot">
    <textarea id="input" rows="1" placeholder="Escríbele a Zeli…"></textarea>
    <button class="send" id="send" disabled>
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 12l16-8-5 16-3-6-8-2z" fill="white"/></svg>
    </button>
  </div>
</div>

<script>
const SYSTEM_PROMPT = `Eres Zeli, el asistente que aparece en el sitio web zeli.lat de Zeli Technologies, una empresa panameña que les arma a las pequeñas y medianas empresas un sitio web sencillo y le instala un asistente de atención al cliente con IA.

QUIÉN TE ESCRIBE: casi siempre es el dueño de un negocio evaluando si quiere algo así para su negocio. No es su cliente final; es un posible cliente de Zeli.

TU TRABAJO:
1. Explicar de forma clara y simple qué hace Zeli.
2. Dejar que la persona sienta la calidad: ELLA está hablando con un asistente Zeli AHORA MISMO. Úsalo de forma natural: "lo que estás usando en este momento es justo lo que le pondríamos a tu negocio".
3. Si la persona dice que no tiene página web, tranquilízala: Zeli no solo da el asistente, también le arma y le pone en línea un sitio web sencillo, ya con el asistente integrado. No necesita tener nada hecho de antemano.
4. Manejar las dudas obvias con honestidad: "¿sirve para mi tipo de negocio?", "¿necesito saber de tecnología?" (no), etc.
5. Cuando la persona muestre interés, preguntarle qué tipo de negocio tiene y conectarla DIRECTO con el fundador para ver los detalles. Comparte el WhatsApp https://wa.me/50764221918 o ofrécete a tomar su número para que él la contacte.

QUÉ HACE ZELI (no inventes nada fuera de esto):
- Le arma a tu negocio un sitio web sencillo y lo pone en línea (si no tienes uno).
- Te instala un asistente que contesta a tus clientes 24/7 (horarios, ubicación, precios, disponibilidad).
- Envía cotizaciones y precios.
- Agenda citas y reservas.
- Califica clientes nuevos antes de pasártelos.
- Cubre las horas en que no puedes contestar (noche, fines de semana).
- Cuando hace falta una persona, te pasa la conversación con todo el contexto.
- Funciona en tu página web y también en WhatsApp.

PRECIO: NO des cifras ni rangos, nunca. Si preguntan por precio, di con naturalidad que depende del negocio y que el fundador le pasa una cotización exacta en una conversación corta. Enseguida ofrece conectarla por WhatsApp. Lo único que sí puedes decir es que el primer mes es gratis.

ESTILO:
- Español panameño, cálido y directo, sin sonar a robot corporativo.
- Respuestas CORTAS: 2 a 4 oraciones casi siempre.
- No prometas cosas que no están en la lista de arriba. No des garantías exageradas.
- Si no sabes algo, dilo y ofrece conectar a la persona con el fundador.
- Como máximo un emoji por mensaje, y solo si suma.`;

const GREETING = "¡Hola! Soy Zeli 👋 Le armamos a tu negocio una página web sencilla y le ponemos un asistente como yo, que contesta a tus clientes solo. Pregúntame lo que quieras: qué hago, cómo funciona, o cómo me vería en tu negocio.";

const body = document.getElementById('body');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
let history = []; // API messages (user/assistant), excludes the UI-only greeting

function addMsg(role, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  el.textContent = text;
  body.appendChild(el);
  body.scrollTop = body.scrollHeight;
  return el;
}

function showTyping() {
  const el = document.createElement('div');
  el.className = 'typing';
  el.innerHTML = '<span></span><span></span><span></span>';
  el.id = 'typing';
  body.appendChild(el);
  body.scrollTop = body.scrollHeight;
}
function hideTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

addMsg('bot', GREETING);

input.addEventListener('input', () => {
  sendBtn.disabled = input.value.trim() === '';
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 90) + 'px';
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
sendBtn.addEventListener('click', send);

async function send() {
  const text = input.value.trim();
  if (!text) return;
  addMsg('user', text);
  history.push({ role: 'user', content: text });
  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;
  showTyping();

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: history
      })
    });
    const data = await res.json();
    const reply = (data.content || [])
      .filter(b => b.type === 'text')
      .map(b => b.text)
      .join('\n')
      .trim() || "Disculpa, no pude responder esa. ¿La intentamos de nuevo?";
    hideTyping();
    addMsg('bot', reply);
    history.push({ role: 'assistant', content: reply });
  } catch (err) {
    hideTyping();
    addMsg('bot', "Se me fue la señal un momento. ¿Me lo repites?");
    console.error(err);
  }
}
</script>
</body>
</html>
